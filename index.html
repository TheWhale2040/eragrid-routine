:root{
  --bg:#F3F7F5;--card:#FFFFFF;--ink:#10241C;--muted:#667A71;--line:#E3EBE7;--brand:#1F6F54;--brand-2:#19C98F;--brand-soft:#E4F4EC;
  --amber:#F2A33A;--red:#D8473F;--blue:#3B7DD8;--violet:#7B5EA7;--shadow:0 1px 2px rgba(16,36,28,.05),0 8px 24px rgba(16,36,28,.06);
  --r:20px;--r-sm:14px;--nav-h:68px;
}
html[data-theme="dark"]{
  --bg:#0D1512;--card:#15211C;--ink:#E8F2EC;--muted:#92A99E;--line:#233229;--brand:#2FB88A;--brand-2:#4BE0AE;--brand-soft:#173026;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kufi","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.app{min-height:100vh;display:flex;flex-direction:column;max-width:1080px;margin:0 auto}
main{flex:1;padding:12px 14px calc(var(--nav-h) + 96px)}
main.enter{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 2px 14px}
.greet{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.hijri{color:var(--brand);font-weight:700;margin-top:2px}
.greg{color:var(--muted);font-size:.9rem}
.top-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--muted);font-size:.85rem}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* hero prayer */
.hero{background:linear-gradient(135deg,var(--brand),#124634);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset-inline-start:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{opacity:.8;font-size:.85rem}
.hero .nm{font-size:1.7rem;font-weight:800}
.hero .cd{font-variant-numeric:tabular-nums;font-size:1.15rem;opacity:.95}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.pbtn{background:rgba(255,255,255,.12);border-radius:14px;padding:8px 2px;text-align:center;color:#fff;transition:.2s;position:relative}
.pbtn b{display:block;font-size:.82rem;font-weight:700}
.pbtn span{font-size:.78rem;opacity:.85;font-variant-numeric:tabular-nums}
.pbtn.on{background:#fff;color:var(--brand)}

  const donut = CATS.map((c) => { const v = byCat[c.id] || 0; if (!v) return ""; const len = (v / catTot) * C, seg = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${c.color}" stroke-width="18" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`; acc += len; return seg; }).join("");
  const wk = WEEKDAYS.map((n, i) => { const xs = withScore.filter((x) => x.d.getDay() === i); return { n, v: xs.length ? xs.reduce((a, x) => a + x.st.score, 0) / xs.length : null }; });
  const bestDay = wk.filter((x) => x.v != null).sort((a, b) => b.v - a.v)[0];
  const habs = activeHabits().map((h) => { const since = days.filter((x) => (h.since || "0000") <= x.ds); const n = since.filter((x) => checked(h.id, x.ds)).length; return { h, rate: since.length ? n / since.length : 0, n, len: since.length }; });
  return `<header class="top"><div><div class="greet">إحصائياتك</div><div class="greg">أرقام تعطيك صورة حقيقية، بدون جلد للنفس</div></div></header>

<div class="kpis"><div class="kpi"><b>${N(Math.round(avg * 100))}%</b><span>متوسط الإنجاز اليومي</span></div><div class="kpi" style="border-color:var(--amber)"><b>${N(tD)}</b><span>مهمة منجزة من ${N(tT)}</span></div>
<div class="kpi" style="border-color:var(--blue)"><b>${N(Math.round(prRate * 100))}%</b><span>الالتزام بتسجيل الصلوات</span></div><div class="kpi" style="border-color:var(--violet)"><b>${N(fmin)}</b><span>دقيقة تركيز</span></div></div>
<section class="card"><h2>الإنجاز يوم بيوم</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="رسم الإنجاز اليومي">${bars}<line x1="0" x2="${W}" y1="${H - 14}" y2="${H - 14}" stroke="var(--line)"/></svg>
<div class="row between sub"><span>${longDate(days[0].ds)}</span><span>اليوم</span></div></section>
<div class="twocol"><section class="card"><h2>المنجز حسب التصنيف</h2>${catTot ? `<div class="row" style="gap:18px"><svg viewBox="0 0 120 120" width="120">${donut}</svg><div class="grow">${CATS.filter((c) => byCat[c.id]).map((c) => `<div class="row between" style="font-size:.88rem"><span><i class="dot" style="background:${c.color}"></i>${c.name}</span><b>${N(byCat[c.id])}</b></div>`).join("")}</div></div>` : empty("ما فيه بيانات بعد", "أنجز بعض المهام وترجع هنا.")}</section>
<section class="card"><h2>ثبات العادات</h2>${habs.length ? habs.map((x) => `<div style="margin-bottom:12px"><div class="row between" style="font-size:.9rem"><span>${esc(x.h.icon || "⭐")} ${esc(x.h.title)}</span><b>${N(Math.round(x.rate * 100))}%</b></div><div class="bar"><i style="width:${x.rate * 100}%"></i></div></div>`).join("") : empty("ما عندك عادات", "أضف عادة لتشوف ثباتها.")}${bestDay ? `<div class="sub" style="margin-top:6px">أفضل يوم عندك: <b>${bestDay.n}</b></div>` : ""}</section></div>`;
}

const views = { today: viewToday, tasks: viewTasks, habits: viewHabits, cal: viewCal, stats: viewStats, focus: viewFocus, settings: viewSettings };

// ---------- shell ----------
const NAV = [["today", "اليوم", I.today], ["tasks", "المهام", I.tasks], ["habits", "العادات", I.habits], ["cal", "التقويم", I.cal], ["stats", "الإحصاء", I.stats]];
function render() {
  const y = window.scrollY, th = S.settings.theme === "auto" ? (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light") : S.settings.theme;
  document.documentElement.dataset.theme = th;
  const showFab = ["today", "tasks", "cal"].includes(view);
  $("#app").innerHTML = `<div class="app"><nav class="tabs" aria-label="التنقل">${NAV.map(([k, n, ic]) => `<button class="${view === k ? "on" : ""}" data-act="go" data-v="${k}">${ic}<span>${n}</span></button>`).join("")}</nav><main class="${animateNext ? "enter" : ""}">${views[view]()}</main></div>${showFab ? `<button class="fab" data-act="newtask" aria-label="مهمة جديدة">${I.plus}</button>` : ""}`;
  animateNext = false;

// ---------- sheets ----------
function openSheet(html) {
  closeSheet();
  const l = document.createElement("div"); l.id = "layer";
  l.innerHTML = `<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(l);
  const f = $("input[autofocus],input[name=title]", l); if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet() { const l = $("#layer"); if (l) l.remove(); }
const optsHtml = (name, list, cur) => `<div class="opts" data-opts="${name}">${list.map((o) => `<button type="button" class="opt ${o.id === cur ? "on" : ""}" data-act="opt" data-name="${name}" data-val="${o.id}">${o.name}</button>`).join("")}</div>`;

function taskSheet(id, date) {
  const t = id ? S.tasks.find((x) => x.id === id) : { title: "", date: date || todayStr(), time: "", cat: "me", prio: "mid", repeat: "", notes: "" };
  openSheet(`<h3>${id ? "تعديل المهمة" : "مهمة جديدة"}</h3><form data-form="task" data-id="${id || ""}">

<div class="f"><label>التصنيف</label>${optsHtml("cat", CATS, t.cat)}</div><div class="f"><label>الأولوية</label>${optsHtml("prio", PRIOS, t.prio)}</div>
<div class="f"><label>التكرار</label>${optsHtml("repeat", [{ id: "", name: "مرة وحدة" }, { id: "daily", name: "يوميًا" }, { id: "weekly", name: "أسبوعيًا" }], t.repeat || "")}</div>
<div class="f"><label>ملاحظات</label><textarea name="notes" rows="2" maxlength="400">${esc(t.notes)}</textarea></div>
<input type="hidden" name="cat" value="${t.cat}"><input type="hidden" name="prio" value="${t.prio}"><input type="hidden" name="repeat" value="${t.repeat || ""}">
<div class="row"><button class="btn grow" type="submit">حفظ</button>${id ? '<button class="btn danger" type="button" data-act="deltask" data-id="' + id + '">حذف</button>' : ""}</div></form>`);
}
function habitSheet(id) {
  const h = id ? S.habits.find((x) => x.id === id) : { title: "", icon: "⭐" };
  openSheet(`<h3>${id ? "تعديل العادة" : "عادة جديدة"}</h3><form data-form="habit" data-id="${id || ""}">
<div class="f"><label>اسم العادة</label><input name="title" value="${esc(h.title)}" maxlength="40" required placeholder="مثال: قراءة عشر صفحات"></div>
<div class="f"><label>الأيقونة</label><input name="icon" value="${esc(h.icon || "⭐")}" maxlength="4" style="width:90px;text-align:center;font-size:1.4rem"></div>
${id ? "" : `<div class="f"><label>اقتراحات (اضغط لتعبئة سريعة)</label><div class="opts">${HABIT_PRESETS.map((p) => `<button type="button" class="opt" data-act="preset" data-t="${esc(p.t)}" data-i="${p.i}">${p.i} ${p.t}</button>`).join("")}</div></div>`}
<div class="row"><button class="btn grow" type="submit">حفظ</button>${id ? '<button class="btn danger" type="button" data-act="delhabit" data-id="' + id + '">حذف</button>' : ""}</div></form>`);
}
function habitDetail(id) {
  const h = S.habits.find((x) => x.id === id); if (!h) return;
  const weeks = 13, today = new Date(), off = (today.getDay() - S.settings.weekStart + 7) % 7, start = addDays(today, -off - (weeks - 1) * 7);
  let grid = ""; const cs = 16, g = 4;
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const dt = addDays(start, w * 7 + d), k = ymd(dt); if (dt > today) continue;
    grid += `<rect x="${(weeks - 1 - w) * (cs + g)}" y="${d * (cs + g)}" width="${cs}" height="${cs}" rx="5" fill="${checked(id, k) ? "var(--brand-2)" : "var(--line)"}"/>`;
  }
  let total = 0; Object.keys(S.checks).forEach((k) => { if (S.checks[k][id]) total++; });
  openSheet(`<h3>${esc(h.icon || "⭐")} ${esc(h.title)}</h3><div class="grid3" style="margin-bottom:14px"><div class="kpi"><b>${N(streak(id))}</b><span>السلسلة الحالية</span></div><div class="kpi" style="border-color:var(--amber)"><b>${N(bestStreak(id))}</b><span>أطول سلسلة</span></div><div class="kpi" style="border-color:var(--blue)"><b>${N(total)}</b><span>مجموع الأيام</span></div></div>
<div class="sub" style="margin-bottom:6px">آخر ${N(weeks)} أسبوع</div><svg viewBox="0 0 ${weeks * (cs + g)} ${7 * (cs + g)}" width="100%">${grid}</svg>
<div class="row" style="margin-top:14px"><button class="btn grow" data-act="edithabit" data-id="${id}">تعديل</button><button class="btn ghost" data-act="closesheet">إغلاق</button></div>`);
}
function daySheet(ds) {
  const items = tasksOn(ds), hs = activeHabits().filter((h) => (h.since || "0000") <= ds), d = parse(ds);
  openSheet(`<h3>${longDate(ds)}</h3><div class="hijri" style="margin:-8px 0 10px">${N(Prayer.hijri(d))}</div>
<div style="margin-bottom:10px">${items.length ? items.map((x) => taskItem(x.t, x.done, ds, false)).join("") : '<div class="sub">ما فيه مهام في هذا اليوم.</div>'}</div>
${hs.length ? `<div class="sub" style="font-weight:700;margin-bottom:4px">العادات</div>${hs.map((h) => habitRow(h, ds, false)).join("")}` : ""}
<div class="f" style="margin-top:10px"><label>ملاحظة اليوم</label><textarea data-act="note" data-date="${ds}" rows="2" maxlength="500" placeholder="سطر عن يومك…">${esc(S.notes[ds] || "")}</textarea></div>
<div class="row"><button class="btn grow" data-act="newtask" data-date="${ds}">مهمة في هذا اليوم</button><button class="btn ghost" data-act="closesheet">إغلاق</button></div>`);
}
function onboarding() {
  openSheet(`<h3>أهلًا فيك 👋</h3><p class="sub" style="margin-bottom:12px">ثلاث خطوات صغيرة وتبدأ. كل شي يبقى على جهازك.</p><form data-form="onboard">
<div class="f"><label>وش نناديك؟ (اختياري)</label><input name="name" maxlength="24" placeholder="اسمك"></div>
<div class="f"><label>مدينتك (لأوقات الصلاة)</label><select name="city">${CITIES.map((c) => `<option value="${c[0]}">${c[1]}</option>`).join("")}</select></div>
<div class="f"><label>اختر عادات تبي تبدأ فيها</label><div class="opts">${HABIT_PRESETS.slice(0, 8).map((p, i) => `<button type="button" class="opt ${i < 2 ? "on" : ""}" data-act="multi" data-t="${esc(p.t)}" data-i="${p.i}">${p.i} ${p.t}</button>`).join("")}</div></div>
<button class="btn block" type="submit">ابدأ</button></form>`);

// ---------- events ----------
function after(msg) { save(); render(); if (msg) toast(msg); celebrate(); }
function celebrate() {
  const ds = todayStr(), st = dayStats(ds);
  if (st.total >= 2 && st.score === 1 && !S.celebrated[ds]) { S.celebrated[ds] = 1; save(); confetti(); toast("ما شاء الله! خلّصت يومك كله 🎉"); }
}
const acts = {
  go: (e, el) => { animateNext = true; view = el.dataset.v; closeSheet(); render(); window.scrollTo(0, 0); },
  toggle: (e, el) => { const done = toggleTask(el.dataset.id, el.dataset.date); after(); if (done) beep(1); const s = $("#layer .sheet"); if (s && $("[data-act=note]", s)) { /* refresh open day sheet */ daySheet($("[data-act=note]", s).dataset.date); } },
  edit: (e, el) => taskSheet(el.dataset.id),
  newtask: (e, el) => taskSheet(null, el.dataset.date),
  hcheck: (e, el) => { setCheck(el.dataset.id, el.dataset.date, !checked(el.dataset.id, el.dataset.date)); after(); const s = $("#layer .sheet [data-act=note]"); if (s) daySheet(s.dataset.date); },
  prayer: (e, el) => { const ds = todayStr(); setPrayer(ds, el.dataset.k, !prayerDone(ds, el.dataset.k)); after(); },
  newhabit: () => habitSheet(null), edithabit: (e, el) => habitSheet(el.dataset.id), hdetail: (e, el) => habitDetail(el.dataset.id),
  delhabit: (e, el) => { if (confirm("تحذف هذه العادة وسجلها؟")) { const h = S.habits.find((x) => x.id === el.dataset.id); if (h) h.archived = true; closeSheet(); after("انحذفت العادة"); } },
  deltask: (e, el) => { if (confirm("تحذف هذه المهمة؟")) { S.tasks = S.tasks.filter((x) => x.id !== el.dataset.id); closeSheet(); after("انحذفت المهمة"); } },
  closesheet: () => closeSheet(),
  tfilter: (e, el) => { taskFilter = el.dataset.k; render(); },
  day: (e, el) => daySheet(el.dataset.date),
  cal: (e, el) => { const n = +el.dataset.n; calMonth = n === 0 ? new Date() : new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1); render(); },
  range: (e, el) => { statRange = +el.dataset.n; render(); },
  opt: (e, el) => { $$(`[data-opts="${el.dataset.name}"] .opt`, el.closest("form")).forEach((b) => b.classList.remove("on")); el.classList.add("on"); $(`input[name=${el.dataset.name}]`, el.closest("form")).value = el.dataset.val; },
  preset: (e, el) => { const f = el.closest("form"); f.title.value = el.dataset.t; f.icon.value = el.dataset.i; },
  multi: (e, el) => el.classList.toggle("on"),
  setopt: (e, el) => { const v = el.dataset.val; S.settings[el.dataset.set] = v === "true" ? true : v === "false" ? false : /^\d+$/.test(v) ? +v : v; after(); },
  export: () => exportData(),
  import: () => $("#impf").click(),
  reset: () => { if (confirm("هذا يمسح كل المهام والعادات والسجل. متأكد؟") && confirm("آخر تأكيد: ما فيه رجعة إلا من نسخة احتياطية.")) { S = fresh(); save(); view = "today"; render(); onboarding(); } },
  fmode: (e, el) => { if (focus.running) return; focus = { mode: el.dataset.k, total: +el.dataset.m * 60, left: +el.dataset.m * 60, running: false, endAt: 0, taskId: focus.taskId }; render(); },
  fstart: () => {
    if (focus.running) { focus.left = Math.max(0, Math.round((focus.endAt - Date.now()) / 1000)); focus.running = false; }
    else { if (!focus.left) focus.left = focus.total; focus.endAt = Date.now() + focus.left * 1000; focus.running = true; try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (x) { /* optional */ } }
    render();
  },
  freset: () => { focus.running = false; focus.left = focus.total; render(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.tagName === "TEXTAREA" || (el.tagName === "INPUT")) return;
  const fn = acts[el.dataset.act]; if (fn) { e.preventDefault(); fn(e, el); }
});
document.addEventListener("change", (e) => {
  const el = e.target; const a = el.dataset && el.dataset.act;
  if (a === "city") { const c = CITIES.find((x) => x[0] === el.value); S.settings.city = el.value; if (c) { S.settings.lat = c[2]; S.settings.lon = c[3]; } after(); }
  else if (a === "lat" || a === "lon") { S.settings[a] = clamp(+el.value || 0, -90 * (a === "lat" ? 1 : 2), 90 * (a === "lat" ? 1 : 2)); save(); }
  else if (a === "name") { S.settings.name = el.value.trim(); save(); }
  else if (a === "ftask") focus.taskId = el.value;
  else if (el.id === "impf" && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { if (confirm("هذا يستبدل بياناتك الحالية بالنسخة. تكمل؟")) { importData(r.result); view = "today"; render(); toast("تم الاسترجاع"); } } catch (x) { alert("الملف غير صالح"); } };
    r.readAsText(el.files[0]); el.value = "";
  }
});
document.addEventListener("input", (e) => { if (e.target.dataset && e.target.dataset.act === "note") { const ds = e.target.dataset.date; if (e.target.value.trim()) S.notes[ds] = e.target.value; else delete S.notes[ds]; save(); } });
document.addEventListener("submit", (e) => {
  const f = e.target, kind = f.dataset.form; if (!kind) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (kind === "qadd") { const t = (v.t || "").trim(); if (t) { addTask({ title: t }); f.reset(); after(); const i = $("input[name=t]"); i && i.focus(); } }
  else if (kind === "task") {
    const o = { title: v.title.trim(), date: v.date, time: v.time || "", cat: v.cat, prio: v.prio, repeat: v.repeat, notes: (v.notes || "").trim() };
    if (!o.title) return;
    if (f.dataset.id) Object.assign(S.tasks.find((x) => x.id === f.dataset.id), o); else addTask(o);
    closeSheet(); after("انحفظت المهمة");
  } else if (kind === "habit") {
    const title = v.title.trim(); if (!title) return;
    if (f.dataset.id) Object.assign(S.habits.find((x) => x.id === f.dataset.id), { title, icon: v.icon || "⭐" }); else S.habits.push({ id: uid(), title, icon: v.icon || "⭐", since: todayStr() });
    closeSheet(); after("انحفظت العادة");
  } else if (kind === "onboard") {
    const city = CITIES.find((c) => c[0] === v.city) || CITIES[0];
    Object.assign(S.settings, { name: (v.name || "").trim(), city: city[0], lat: city[2], lon: city[3], onboarded: true });
    $$("#layer .opt.on").forEach((b) => S.habits.push({ id: uid(), title: b.dataset.t, icon: b.dataset.i, since: todayStr() }));
    closeSheet(); after("جاهز! بالتوفيق");
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

// ---------- clock ----------
function tick() {
  const now = Date.now();
  if (todayStr() !== lastDay) { lastDay = todayStr(); render(); return; }
  if (view === "today") { const c = $("#cd"); if (c) c.textContent = cd(nextAt - now); if (now >= nextAt) render(); }
  if (focus.running) {
    const left = Math.max(0, Math.round((focus.endAt - now) / 1000)); focus.left = left;
    const tm = $("#ftime"); if (tm) { tm.textContent = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`; const fr = $("#fring"); if (fr) { const circ = fr.querySelector(".ring-fg"), r = circ.getAttribute("r"), c = 2 * Math.PI * r; circ.setAttribute("stroke-dashoffset", c * (left / focus.total)); } }
    if (!left) {
      focus.running = false;
      if (focus.mode === "work") { S.focus.push({ ts: Date.now(), minutes: Math.round(focus.total / 60), taskId: focus.taskId }); save(); }
      beep(3); toast(focus.mode === "work" ? "انتهت الجلسة. خذ استراحة 🌿" : "انتهت الاستراحة. نرجع للشغل 💪");
      try { if ("Notification" in window && Notification.permission === "granted") new Notification("لوحة الروتين", { body: focus.mode === "work" ? "انتهت جلسة التركيز" : "انتهت الاستراحة" }); } catch (x) { /* optional */ }
      focus.left = focus.total; render();
    }
  }
}
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
render();
if (!S.settings.onboarded) onboarding();

</script>
